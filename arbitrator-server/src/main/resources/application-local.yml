# Local-only, git-ignored (rules.md Rule 6). Matches scripts/init-db.sql.
spring:
  datasource:
    username: arbitrator
    password: Changeme123!

arbitrator:
  judge:
    # Eclipse's "Run As -> Java Application" doesn't inherit this shell's
    # PATH, so a bare "docker" fails with "No such file or directory" even
    # though `which docker` works fine in a terminal — see `which docker`.
    # SandboxExecutor now auto-detects common install paths on its own when
    # this stays at the default "docker", so this override is no longer
    # required, but it's left here since it's harmless and one line faster.
    docker-binary: /usr/local/bin/docker
    # Keep the production cooldown active locally; tests explicitly override it in their test profile.
    submit-cooldown-seconds: 10
