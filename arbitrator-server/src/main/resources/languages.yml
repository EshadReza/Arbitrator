# FR-21: per-language compile/run commands. LanguageCommandPolicy validates
# these at startup against an executable/option allowlist. Adding a language
# therefore also requires an explicit policy entry in the judge engine.
# Owner: Mahir (AGENTS.md Rule 1).
#
# Placeholders:
#   {src}  absolute path of the source file inside the work dir
#   {exe}  absolute path of the produced binary (compiled languages)
#   {dir}  the per-submission work dir
arbitrator:
  judge:
    languages:
      cpp17:
        source-file: main.cpp
        # Dynamic linking is safe because both compilation and execution occur
        # in the pinned Docker image. The runtime root and workspace are read-only.
        compile: "g++ -O2 -std=c++17 -o {exe} {src}"
        run: "{exe}"
      java17:
        source-file: Main.java
        compile: "javac -d {dir} {src}"
        # -Xss256m avoids spurious stack RE on deep recursion problems
        run: "java -XX:+UseSerialGC -Xss256m -cp {dir} Main"
      python310:
        source-file: main.py
        compile: ""                      # interpreted: no compile step
        run: "python3 {src}"
