# Committed with placeholders ONLY (AGENTS.md Rule 6).
# Real credentials go in application-local.yml (git-ignored) or env vars.
spring:
  application:
    name: arbitrator-server
  profiles:
    include: local        # picks up application-local.yml if present
  config:
    # languages.yml (owned by Mahir, AGENTS.md Rule 1) is a separate file and
    # Spring Boot does NOT load it automatically — only application.yml and
    # profile variants load on their own. Without this import,
    # JudgeProperties.languages silently binds empty and every submission
    # fails with "Language not configured" (mapped to an unexplained RE).
    import: optional:classpath:languages.yml
  datasource:
    url: jdbc:mysql://localhost:3306/arbitrator?serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:arbitrator}
    password: ${DB_PASS:Changeme123!}
    hikari:
      minimum-idle: 5          # DBR-06
      maximum-pool-size: 20    # DBR-06
  jpa:
    hibernate:
      ddl-auto: validate       # schema is owned by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 64MB      # problem package ZIPs (FR-05)
      max-request-size: 64MB

server:
  forward-headers-strategy: none # Login IP limits use the socket peer, never untrusted forwarded headers.
  port: 8080                   # §3.3.4; HTTP only for v1.0 (decision D4)
  error:
    # Without this Spring returns a bare {"error":"Forbidden"} and every
    # specific reason we raise ("the contest is paused", "wait 30 seconds
    # between submissions", "password must be at least 8 characters") is
    # silently dropped before it reaches the student.
    include-message: always
    # SafeErrorAttributes masks 5xx while existing 4xx guidance remains visible.
    include-stacktrace: never
    include-exception: false
    include-binding-errors: never

arbitrator:
  api-rate-limit:
    window-seconds: 60
    max-keys: 20000
    account-total: 1200
    ip-total: 12000 # Headroom for polling from many students behind one lab address.
    account: {read: 600, write: 120, join: 10, run: 12, submit: 6, clarification: 5}
    ip: {read: 12000, write: 2400, registration: 30, login: 600, join: 240, run: 240, submit: 240, clarification: 120}
  auth:
    login:
      account-attempts: 20
      ip-attempts: 120 # Shared lab IPs need more headroom than individual accounts.
      account-failures: 5
      ip-failures: 20
      account-concurrent: 2
      ip-concurrent: 16
      window-seconds: 60
      base-cooldown-seconds: 5
      max-cooldown-seconds: 300
      max-keys: 10000
  jwt:
    # Optional override; absent/blank generates a private in-memory key per startup.
    secret: ${ARBITRATOR_JWT_SECRET:}
    expiry-hours: 12
  session:
    admin-idle-minutes: 30
    student-idle-minutes: 0  # Disabled during long coding sessions; absolute JWT expiry still applies.
    sweep-millis: 15000
  judge:
    threads: 10                # NFR-P04: >= 10 parallel judging jobs
    max-backlog: ${ARBITRATOR_JUDGE_MAX_BACKLOG:500}
    max-active-containers: ${ARBITRATOR_JUDGE_MAX_CONTAINERS:10}
    # 0 = automatically reserve at most 70% of physical RAM across all
    # simultaneous compiler, checker, submission, and custom-run containers.
    max-total-memory-mb: ${ARBITRATOR_JUDGE_MEMORY_BUDGET_MB:0}
    max-custom-runs: ${ARBITRATOR_MAX_CUSTOM_RUNS:2}
    max-source-bytes: ${ARBITRATOR_MAX_SOURCE_BYTES:262144}
    # Every compile and every test run happens inside a container built from
    # this image (scripts/docker/build-sandbox-image.sh) — no participant
    # code ever runs directly on this machine. At startup the tag is resolved
    # once to an immutable sha256 image ID used for every subsequent run.
    docker-binary: ${ARBITRATOR_DOCKER_BIN:docker}
    docker-image: ${ARBITRATOR_DOCKER_IMAGE:arbitrator-judge:latest}
    work-root: ${java.io.tmpdir}/arbitrator
    compile-timeout-ms: 30000
    # BR-01. SRS says 30 s; the team settled on 10 s for production. Stays
    # configurable — set ARBITRATOR_SUBMIT_COOLDOWN=0 for local dev/testing,
    # but do NOT ship a real contest with it at 0 (see application-local.yml).
    submit-cooldown-seconds: ${ARBITRATOR_SUBMIT_COOLDOWN:10}

  materials:
    # Where uploaded materials (slides, PDFs, any file) live on disk — see
    # MaterialService and V65. Persistent across restarts, unlike judge.work-root:
    # these are files students expect to still find later, not scratch space.
    root: ${ARBITRATOR_MATERIALS_ROOT:./arbitrator-data/materials}

  contest:
    reset-on-boot: ${ARBITRATOR_RESET_ON_BOOT:false}

  admin:
    # Open the instructor console in the default browser once the server is up.
    # Set false on a headless lab server, where there is no browser to open and
    # nobody sitting at the machine. The URL is logged either way.
    auto-open: ${ARBITRATOR_ADMIN_AUTO_OPEN:true}

logging:
  level:
    com.arbitrator: INFO
    # JDBC diagnostics can echo unique-field values supplied by users.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
