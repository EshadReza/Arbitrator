# Integration-test profile. Points at a SEPARATE schema so tests never touch
# a developer's working data. Create it once with:
#   mysql -u root -e "CREATE DATABASE arbitrator_test CHARACTER SET utf8mb4;
#                     GRANT ALL ON arbitrator_test.* TO 'arbitrator'@'localhost';"
spring:
  config:
    import: optional:classpath:languages.yml
  datasource:
    url: jdbc:mysql://localhost:3306/arbitrator_test?serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:arbitrator}
    password: ${DB_PASS:Changeme123!}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Wipe and re-migrate every run so each test starts from a known schema.
    clean-disabled: false
    clean-on-validation-error: true
    locations: classpath:db/migration

arbitrator:
  api-rate-limit:
    ip:
      # Integration fixtures share localhost; the dedicated rate-limit attack
      # test overrides this to 3 and still verifies registration throttling.
      registration: 300
  admin:
    auto-open: false               # a test run must never launch a browser
  jwt:
    secret: test-only-secret-0123456789abcdef0123456789abcdef0123456789
    expiry-hours: 1
  judge:
    threads: 4
    submit-cooldown-seconds: 0     # BR-01 rate limit off; tests submit rapidly

logging:
  level:
    com.arbitrator: INFO
