# Client-side server address (§3.3.4). A copy of this file placed next to the
# installed client overrides this classpath default — that is how the lab
# installer points 30 machines at the instructor's PC (chunk S4-C2).
#
# scheme stays http for v1.0 (decision D4); flipping to https later is a
# one-line change here, not a refactor.
server.scheme=http
server.host=127.0.0.1
server.port=8080
