# Committed with placeholders ONLY (rules.md Rule 6).
# Real credentials go in application-local.yml (git-ignored) or env vars.
spring:
  application:
    name: labjudge-server
  profiles:
    include: local        # picks up application-local.yml if present
  config:
    # languages.yml (owned by Mahir, rules.md Rule 1) is a separate file and
    # Spring Boot does NOT load it automatically — only application.yml and
    # profile variants load on their own. Without this import,
    # JudgeProperties.languages silently binds empty and every submission
    # fails with "Language not configured" (mapped to an unexplained RE).
    import: optional:classpath:languages.yml
  datasource:
    url: jdbc:mysql://localhost:3306/labjudge?serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${DB_USER:labjudge}
    password: ${DB_PASS:changeme}
    hikari:
      minimum-idle: 5          # DBR-06
      maximum-pool-size: 20    # DBR-06
  jpa:
    hibernate:
      ddl-auto: validate       # schema is owned by Flyway, never by Hibernate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 64MB      # problem package ZIPs (FR-05)
      max-request-size: 64MB

server:
  port: 8080                   # §3.3.4; HTTP only for v1.0 (decision D4)

labjudge:
  jwt:
    # NFR-S07: >= 256-bit secret from environment. The default below is for
    # local development ONLY and must be overridden in any shared deployment.
    secret: ${LABJUDGE_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
    expiry-hours: 12
  judge:
    threads: 10                # NFR-P04: >= 10 parallel judging jobs
    sandbox-script: ${LABJUDGE_SANDBOX:scripts/sandbox-run.sh}
    work-root: ${java.io.tmpdir}/labjudge
    compile-timeout-ms: 30000
    submit-cooldown-seconds: 30   # BR-01

logging:
  level:
    com.labjudge: INFO
